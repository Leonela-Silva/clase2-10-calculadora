<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Dólar en Vivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator-card">
        <h2>💵 Cotizador en Vivo</h2>
        <p class="subtitle">Datos actualizados automáticamente</p>

        <!-- Tarjetas de Cotizaciones -->
        <div class="quotes-grid">
            <div class="quote-box">
                <span class="label">Dólar Oficial</span>
                <span id="oficialPrice" class="price">Cargando...</span>
            </div>
            <div class="quote-box highlight">
                <span class="label">Dólar Blue</span>
                <span id="bluePrice" class="price">Cargando...</span>
            </div>
        </div>

        <!-- Conversor -->
        <div class="converter-box">
            <div class="input-group">
                <label for="typeSelect">Tipo de cambio:</label>
                <select id="typeSelect">
                    <option value="blue">Dólar Blue</option>
                    <option value="oficial">Dólar Oficial</option>
                </select>
            </div>

            <div class="input-group">
                <label for="amountInput">Monto en USD:</label>
                <input type="number" id="amountInput" placeholder="Ej: 100" value="100">
            </div>

            <div class="result-box">
                <span>Total en Pesos (ARS):</span>
                <strong id="resultAmount">$ 0.00</strong>
            </div>
        </div>

        <button id="refreshBtn" class="btn">🔄 Actualizar valores</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
